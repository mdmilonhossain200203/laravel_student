
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <!-- Add Course Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add New Course</h3>
        </div>

        <div class="card-body">
            <form id="courseForm">
                <input type="hidden" id="editIndex">

                <div class="mb-3">
                    <label for="courseName" class="form-label">
                        Course Name
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="courseName"
                        placeholder="Enter course name"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Add Course
                </button>

                <button
                    type="button"
                    class="btn btn-secondary d-none"
                    id="cancelBtn"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>
            </form>
        </div>
    </div>

    <!-- Show Courses -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Course List</h3>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th style="width: 80px;">SL</th>
                            <th>Course Name</th>
                            <th style="width: 200px;">Action</th>
                        </tr>
                    </thead>

                    <tbody id="courseTable">
                        <tr>
                            <td colspan="3" class="text-center">
                                No courses added yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    let courses = [];
    
    const courseForm = document.getElementById("courseForm");
    const courseName = document.getElementById("courseName");
    const courseTable = document.getElementById("courseTable");
    const editIndex = document.getElementById("editIndex");
    const submitBtn = document.getElementById("submitBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    // Add or Update Course
    courseForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = courseName.value.trim();

        if (name === "") {
            alert("Please enter a course name.");
            return;
        }

        if (editIndex.value === "") {
            courses.push(name);
            alert("Course added successfully!");
        } else {
            courses[Number(editIndex.value)] = name;
            alert("Course updated successfully!");
        }

        courseForm.reset();
        cancelEdit();
        showCourses();
    });

    // Display Courses
    function showCourses() {
        courseTable.replaceChildren();

        if (courses.length === 0) {
            const row = courseTable.insertRow();
            const cell = row.insertCell();
            cell.colSpan = 3;
            cell.className = "text-center";
            cell.textContent = "No courses added yet.";
            return;
        }

        courses.forEach(function(course, index) {
            const row = courseTable.insertRow();

            const serialCell = row.insertCell();
            serialCell.textContent = index + 1;

            const nameCell = row.insertCell();
            nameCell.textContent = course;

            const actionCell = row.insertCell();

            const editButton = document.createElement("button");
            editButton.type = "button";
            editButton.className = "btn btn-warning btn-sm me-2";
            editButton.textContent = "Update";
            editButton.addEventListener("click", function() {
                editCourse(index);
            });

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "btn btn-danger btn-sm";
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", function() {
                deleteCourse(index);
            });

            actionCell.append(editButton, deleteButton);
        });
    }

    // Load Course into Form for Editing
    function editCourse(index) {
        courseName.value = courses[index];
        editIndex.value = index;

        submitBtn.textContent = "Update Course";
        submitBtn.className = "btn btn-success";
        cancelBtn.classList.remove("d-none");

        courseName.focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Delete Course
    function deleteCourse(index) {
        if (confirm("Are you sure you want to delete this course?")) {
            courses.splice(index, 1);

            if (editIndex.value !== "") {
                const currentEdit = Number(editIndex.value);

                if (currentEdit === index) {
                    cancelEdit();
                    courseForm.reset();
                } else if (currentEdit > index) {
                    editIndex.value = currentEdit - 1;
                }
            }

            showCourses();
        }
    }

    // Cancel Update
    function cancelEdit() {
        editIndex.value = "";
        submitBtn.textContent = "Add Course";
        submitBtn.className = "btn btn-primary";
        cancelBtn.classList.add("d-none");
    }

    showCourses();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
