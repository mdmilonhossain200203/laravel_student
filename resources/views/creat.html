<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
        integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">

    <title>Student management system</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Student management system</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ml-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Add Student</a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link active" href="#">Add Course</a>
                    </li>

                </ul>
                <!-- <form class="d-flex">
                    <input class="form-control mr-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form> -->
            </div>
        </div>
    </nav>


    
    <section>
        <!-- studend add form  -->
        <div class="container">
            <div class="row">
                <div class="col-lg-12 col-md-12">
                  <form class="p-5">

                    <div class="mb-3">
                      <label for="name" class="form-label">name</label>
                      <input type="name" name="name" class="form-control" id="name" aria-describedby="name">
                      
                    </div>

                    <div class="mb-3">
                      <label for="exampleInputEmail1" class="form-label">Email address</label>
                      <input type="email" name="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                     
                    </div>

                    <div class="mb-3">
                      <label for="phone" class="form-label">phone</label>
                      <input type="phone" name="phone" class="form-control" id="phone" aria-describedby="phone">
                     
                    </div>

                    <div class="mb-3">
                      <label for="roll" class="form-label">roll</label>
                      <input type="roll" name="roll" class="form-control" id="roll" aria-describedby="roll">
                     
                    </div>

                    <div class="mb-3">
                      <label for="course" class="form-label">course</label>
                      <input type="course" name="course" class="form-control" id="course" aria-describedby="emailHelp">
                   
                    </div>

                    <div class="mb-3">
                      <label for="photos" class="form-label">photos</label>
                      <input type="photos" name="photos" class="form-control" id="photos" aria-describedby="photos">
                      
                    </div>
                   
                    
                    <button type="submit" class="btn btn-primary">Add Student</button>
                  </form>
                </div>
            </div>
        </div>
    </section>


    <!-- Optional JavaScript -->
    <!-- Popper.js first, then Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js"
        integrity="sha384-oesi62hOLfzrys4LxRF63OJCXdXDipiYWBnvTl9Y9/TRlw5xlKIEHpNyvvDShgf/"
        crossorigin="anonymous"></script>
</body>

</html>
